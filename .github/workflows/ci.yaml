name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

defaults:
    run:
        shell: bash

jobs:
    all:
        name: All

        strategy:
            matrix:
                os:
                    - macos-latest
                    - ubuntu-latest
                    - windows-latest

        runs-on: ${{matrix.os}}

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: 'npm'

            - name: Setup macOS/linux
              if: ${{ matrix.os != 'windows-latest' }}
              run: bash scripts/setup.sh

            - name: Setup windows
              if: ${{ matrix.os == 'windows-latest' }}
              shell: pwsh
              run: ./scripts/setup.ps1

            - name: Check formatting
              if: ${{ matrix.os != 'windows-latest' }}
              run: npm run format-check

            - name: Run tests
              run: npm test

            - name: Package
              run: npm run package
              timeout-minutes: 30

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.os }}-binary
                  path: out
                  if-no-files-found: ignore
